services:
  - type: web
    name: ai-research-paper-analyzer-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 300
    healthCheckPath: /health
    plan: free
    envVars:
      # CORS
      - key: ALLOWED_ORIGINS
        value: "https://ai-research-paper-analyzer-sanju234-sans-projects.vercel.app,https://ai-research-paper-analyzer.vercel.app"

      # Groq LLM
      - key: GROQ_API_KEY
        sync: false

      # HuggingFace Embeddings
      - key: HF_TOKEN
        sync: false

      # MongoDB
      - key: MONGODB_URI
        sync: false

      # JWT
      - key: SECRET_KEY
        sync: false

      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Embeddings mode - api = HF Inference API (lower RAM)
      - key: EMBEDDINGS_MODE
        value: api
